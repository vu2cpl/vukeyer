; ============================================================
;  VUKEYER — PlatformIO
;  WinKeyer (K1EL WK3 protocol) clone — WiFi TCP bridge, FlexRadio backend,
;  iambic paddle keying, sidetone, speed pot, OLED panel, settings web page
;
;  Flash:  ./flash.sh            (build + upload; picks the serial port)
;          ./monitor.sh          (serial monitor; picks the port)
;  upload_port / monitor_port are deliberately NOT pinned — see flash.sh.
; ============================================================

[platformio]
default_envs = esp32-vukeyer

[common]
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_src_filter = -<*> +<main.cpp> +<keyer.cpp> +<hostlink.cpp> +<flex.cpp> +<net.cpp> +<display.cpp> +<settings.cpp> +<web.cpp> +<log.cpp> +<fsk.cpp> +<memories.cpp> +<bt.cpp>
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    tzapu/WiFiManager @ 2.0.17
    olikraus/U8g2 @ ^2.35.19
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; Classic ESP32 devkit (CP2102) — current shack board (ESP32-D0WD-V3).
; No native USB: wired fallback is UART via the CP2102.
[env:esp32-vukeyer]
; Arduino core 3.3.11 / ESP-IDF 5.5.5 via the pioarduino fork. The official
; PlatformIO platform stops at Arduino 2.0.17, whose WiFiClient double-frees
; an lwIP pbuf under heavy inbound traffic — it crashed this keyer within
; minutes of sending memories (2026-09-12, backtrace in HANDOVER).
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board         = esp32dev
; Arduino 3.x is ~180 KB bigger than 2.0.17 and the default table (1.31 MB
; app, two OTA slots) hit 94.8%. Nothing here does OTA — updates come over
; USB — so take the single-app layout and its 3 MB.
board_build.partitions = huge_app.csv
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
build_src_filter = ${common.build_src_filter}
lib_deps      = ${common.lib_deps}

; BLE keyboard probe — standalone test sketch, NOT the keyer. Answers whether
; a BLE keyboard pairs and types reliably alongside WiFi on this core before
; any of it goes into the firmware. Flashing it replaces the keyer until
; ./flash.sh puts the keyer back (NVS settings survive).
;   ENV=ble-kbd-probe ./flash.sh   then   ./monitor.sh 115200
[env:ble-kbd-probe]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board         = esp32dev
board_build.partitions = huge_app.csv
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
build_src_filter = -<*> +<probes/ble_kbd_probe.cpp>

; ESP32-S3 N16R8 — port target. Bench-verified 2026-09-23 (esptool): chip
; rev v0.2, 16 MB quad flash (Boya 0x68/0x4018), 8 MB octal PSRAM (AP_3v3),
; MAC ac:27:6e:a5:92:4c. Flashing and the host CDC both ride native USB on
; GPIO 19/20. The second USB-C has its own USB-UART bridge (QFN beside the
; connector, header TX/RX = GPIO 43/44) but neither powered the board nor
; enumerated on first try — that port is meant to work, so treat it as a
; fault to chase, not a board limitation. Pin map lives in include/pins.h
; behind CONFIG_IDF_TARGET_ESP32S3.
[env:esp32s3-vukeyer]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board         = esp32-s3-devkitc-1
; The devkitc-1 board file assumes 8 MB flash and no PSRAM — both wrong for
; N16R8. memory_type qio_opi is the quad-flash/octal-PSRAM combination the
; eFuse readout reports; get it wrong and the PSRAM simply never appears.
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
; huge_app.csv gives one 3 MB app slot and no OTA, same reasoning as the
; classic env. It leaves most of the 16 MB unused — room for a future
; LittleFS partition (memories, FSK macros) rather than a second OTA slot.
board_build.partitions = huge_app.csv
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
build_src_filter = ${common.build_src_filter}
lib_deps      = ${common.lib_deps}
; Console and the WinKeyer host link both over native USB CDC.
build_flags   =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
; Opening the port must not pulse the chip into the bootloader: on
; USB-Serial/JTAG the DTR/RTS pair is the reset+boot strap, so leave both
; deasserted for the monitor.
monitor_dtr   = 0
monitor_rts   = 0
